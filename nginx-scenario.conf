# ─── Scenario file: public read, PIN-protected write (nginx WebDAV) ───
#
# Add this block inside your existing nginx server {} block,
# alongside your other /battery-calculator/ locations.
#
# Prerequisites:
#   1. nginx must be compiled with ngx_http_dav_module (check: nginx -V 2>&1 | grep http_dav)
#      On most distros it's included by default.
#
#   2. Create the data directory and initial file:
#        mkdir -p /var/www/battery-calculator/data
#        echo '{"scenarioId":null,"scenarioName":null,"scenarioTag":null,"updatedAt":null}' \
#          > /var/www/battery-calculator/data/scenario.json
#        chown www-data:www-data /var/www/battery-calculator/data/scenario.json
#
#   3. Create the htpasswd file with your chosen PIN (password):
#        # Install htpasswd if not available:
#        #   apt install apache2-utils   (Debian/Ubuntu)
#        #   yum install httpd-tools     (CentOS/RHEL)
#        htpasswd -cb /etc/nginx/.scenario-htpasswd admin YOUR_PIN_HERE
#
#   4. Test & reload:
#        nginx -t && systemctl reload nginx
#
# ─── How it works ───
#
#   GET  /battery-calculator/data/scenario.json   → served as static file (public, no auth)
#   PUT  /battery-calculator/data/scenario.json   → nginx WebDAV writes the file (basic auth required)
#
#   The frontend sends:  Authorization: Basic base64("admin:PIN")
#   nginx checks it against /etc/nginx/.scenario-htpasswd
#

# Scenario data endpoint
location = /battery-calculator/data/scenario.json {
    alias /var/www/battery-calculator/data/scenario.json;

    # Allow PUT for writing (WebDAV)
    dav_methods PUT;
    dav_access user:rw group:rw all:r;

    # Only require auth for write operations (PUT)
    limit_except GET HEAD OPTIONS {
        auth_basic "Admin PIN";
        auth_basic_user_file /etc/nginx/.scenario-htpasswd;
    }

    # CORS headers (if needed for cross-origin requests)
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS";
    add_header Access-Control-Allow-Headers "Authorization, Content-Type";

    # Handle preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}

# ─── Quick test commands ───
#
#   # Read (should work without auth):
#   curl https://your-domain.com/battery-calculator/data/scenario.json
#
#   # Write (requires PIN):
#   curl -X PUT \
#     -H "Content-Type: application/json" \
#     -u "admin:YOUR_PIN_HERE" \
#     -d '{"scenarioId":"eco-1","scenarioName":"Еконо мія","scenarioTag":"economy","updatedAt":"2026-02-12T15:00:00Z"}' \
#     https://your-domain.com/battery-calculator/data/scenario.json
#
#   # Write with wrong PIN (should return 401):
#   curl -X PUT \
#     -u "admin:wrong-pin" \
#     -d '{}' \
#     https://your-domain.com/battery-calculator/data/scenario.json
