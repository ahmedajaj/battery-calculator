# ─── Battery Calculator: published scenario file ───
#
# Add this block inside your existing nginx server {} block,
# next to the other /battery-calculator/ locations.
#
# GET reads the scenario (residents page), PUT saves it (admin "Опублікувати").
# The PIN is checked by the app itself (VITE_SCENARIO_PIN in .env at build time),
# so nginx does no authentication here.
#
# Setup (as root):
#   nginx -V 2>&1 | grep -o http_dav_module      # must print http_dav_module (else: apt install nginx-full)
#   mkdir -p /var/www/battery-calculator-data
#   echo '{"scenarioId":null,"scenarioName":null,"scenarioTag":null,"updatedAt":null}' \
#     > /var/www/battery-calculator-data/scenario.json
#   chown -R www-data:www-data /var/www/battery-calculator-data   # the folder must be writable, not just the file
#   nginx -t && systemctl reload nginx
#
# Keep the file OUTSIDE dist/ — `npm run build` empties dist/ and would wipe it.

location = /battery-calculator/data/scenario.json {
    alias /var/www/battery-calculator-data/scenario.json;
    dav_methods PUT;
    dav_access user:rw group:rw all:r;
    limit_except GET HEAD PUT { deny all; }
    expires -1;
}

# Test:
#   curl -s https://YOUR-DOMAIN/battery-calculator/data/scenario.json
#   curl -s -o /dev/null -w "%{http_code}\n" -X PUT -H "Content-Type: application/json" \
#     -d '{"scenarioId":null,"scenarioName":null,"scenarioTag":null,"updatedAt":null}' \
#     https://YOUR-DOMAIN/battery-calculator/data/scenario.json      # expect 204
